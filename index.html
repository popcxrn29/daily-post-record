<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Post Diary - Premium Ultimate Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #F8F9FA; 
            --card-bg: #FFFFFF;
            --text-dark: #1C2833; 
            --royal-navy: #1B4F72; 
            --rose-gold: #B47B84; 
            --rose-gold-light: #F9EBEA;
            --border-luxury: #E5E8E8;
            --shadow-luxury: 0 10px 30px rgba(27, 79, 114, 0.05);
            --emerald-green: #27AE60;
        }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 16px; 
            color: var(--text-dark); 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        
        .main-container { width: 100%; max-width: 420px; }
        
        .card { 
            background: var(--card-bg); 
            border-radius: 24px; 
            padding: 22px; 
            box-shadow: var(--shadow-luxury); 
            margin-bottom: 16px; 
            border: 1px solid rgba(180, 123, 132, 0.1);
        }
        
        .header-box { text-align: center; padding: 20px; border-bottom: 3px solid var(--rose-gold); }
        .header-title { color: var(--royal-navy); font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        #date { 
            width: 60%; 
            padding: 10px; 
            border-radius: 14px; 
            border: 1px solid var(--border-luxury); 
            background: #FAFAFA; 
            font-size: 1.05rem; 
            font-weight: 700;
            color: var(--royal-navy);
            text-align: center;
            outline: none;
        }
        
        .user-title { font-size: 1.1rem; font-weight: 700; color: var(--royal-navy); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-left: 4px solid var(--rose-gold); padding-left: 10px; }
        
        .row { 
            display: grid; 
            grid-template-columns: 75px 1fr 55px; 
            gap: 8px; 
            margin-bottom: 12px; 
            align-items: center; 
        }
        
        .input-name { 
            padding: 8px 10px; 
            border: 1px solid var(--border-luxury); 
            border-radius: 12px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: var(--text-dark); 
            background: #FFFFFF; 
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }
        .input-name:focus {
            border-color: var(--rose-gold);
            background: #FFFDFD;
            box-shadow: 0 0 5px rgba(180, 123, 132, 0.15);
        }
        
        .input-time { 
            padding: 8px 4px; 
            border: 1px solid var(--border-luxury); 
            border-radius: 12px; 
            text-align: center; 
            font-size: 0.85rem; 
            width: 100%; 
            box-sizing: border-box;
            color: var(--royal-navy);
            background: #FAFAFA;
            font-weight: 600;
        }
        
        input[type="number"] { 
            padding: 8px 4px; 
            border: 1px solid var(--border-luxury); 
            border-radius: 12px; 
            text-align: center; 
            font-size: 1rem; 
            font-weight: 700; 
            width: 100%; 
            box-sizing: border-box;
            color: var(--royal-navy);
            background: #FAFAFA;
        }
        
        .btn-random {
            background: linear-gradient(135deg, var(--royal-navy), #2C3E50); color: #FFFFFF; border: none; 
            padding: 14px; border-radius: 16px; width: 100%; font-weight: 700; font-size: 1rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(27, 79, 114, 0.2);
        }
        .btn-random:disabled { background: #BDC3C7; cursor: not-allowed; box-shadow: none; }
        
        .btn-save { 
            background: linear-gradient(135deg, var(--royal-navy), #2471A3); color: #FFFFFF; border: none; 
            padding: 14px; border-radius: 16px; width: 100%; font-weight: 700; font-size: 1rem; cursor: pointer; margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(27, 79, 114, 0.2);
        }
        .btn-restore { 
            background: #FFFFFF; color: var(--rose-gold); border: 1px solid var(--rose-gold); 
            padding: 12px; border-radius: 16px; width: 100%; font-weight: 700; font-size: 0.95rem; cursor: pointer;
        }
        
        .btn-toggle-dash {
            background: linear-gradient(135deg, var(--rose-gold), #9A636C); color: #FFFFFF; border: none;
            padding: 14px; border-radius: 16px; width: 100%; font-weight: 700; font-size: 1rem; cursor: pointer; margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(180, 123, 132, 0.2);
        }

        .btn-export-excel {
            background: linear-gradient(135deg, var(--emerald-green), #1E8449); color: #FFFFFF; border: none;
            padding: 14px; border-radius: 16px; width: 100%; font-weight: 700; font-size: 1rem; cursor: pointer; margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.2);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        
        .btn-action { border: none; background: #F2F4F4; color: var(--royal-navy); padding: 7px; font-size: 0.85rem; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .btn-action:hover { background: var(--rose-gold-light); color: var(--rose-gold); }
        .btn-delete { background: #FADBD8; color: #CB4335; }
        
        .dash-title { color: var(--royal-navy); font-weight: 700; font-size: 1.1rem; margin-bottom: 14px; border-left: 4px solid var(--rose-gold); padding-left: 10px; }
        .dash-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 0.95rem; }
        .dash-item { border-bottom: 1px solid #F2F4F4; padding: 10px 0; font-weight: 600; color: var(--text-dark); }
        
        .history-card { background: #FFFFFF; border-radius: 20px; padding: 18px; margin-bottom: 14px; border-top: 4px solid var(--rose-gold); font-size: 0.85rem; box-shadow: var(--shadow-luxury); }
        .h-row { display: grid; grid-template-columns: 65px 1fr 50px; padding: 8px 0; border-bottom: 1px dashed var(--border-luxury); align-items: center; }
        
        .search-box { display: flex; gap: 8px; }
        .search-input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-luxury); border-radius: 14px; font-size: 0.9rem; outline: none; background: #FAFAFA; color: var(--text-dark); }
        .btn-search { background: var(--royal-navy); color: white; border: none; padding: 0 20px; border-radius: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(27, 79, 114, 0.15); }
        .search-result { background: #EBF5FB; padding: 14px; border-radius: 16px; margin-top: 12px; font-size: 0.9rem; display: none; border: 1px solid #AED6F1; color: var(--royal-navy); }
    </style>
</head>
<body>

<div class="main-container">
    <div class="card" style="padding: 14px;">
        <div class="search-box">
            <input type="text" id="searchKey" class="search-input" placeholder="🔍 ค้นหาประวัติวันลงโพสต์ของทรัพย์...">
            <button class="btn-search" onclick="searchAssetDays()">ค้นหา</button>
        </div>
        <div id="searchResult" class="search-result"></div>
    </div>

    <div class="card header-box">
        <div class="header-title">⚜️ Post Diary Premium</div>
        <input id="date" type="date" onchange="checkTodayStatus()">
    </div>

    <div id="randomBox" class="card" style="display:block; text-align:center;">
        <button id="btnRandomAction" class="btn-random" onclick="startRandom()">✨ ดึงแผนงานล็อกทรัพย์สินวันนี้</button>
    </div>

    <div id="inputSection" class="card" style="display: none;">
        <div class="user-title">👤 แผนงานประจำวัน: พี่ขวัญ</div>
        <div id="kw_rows"></div>
        
        <hr style="border:0; border-top:1px solid var(--border-luxury); margin:22px 0;">
        
        <div class="user-title">👤 แผนงานประจำวัน: พี่สุ</div>
        <div id="su_rows"></div>
        
        <div style="margin-top: 26px;">
            <button class="btn-save" onclick="saveData()">💾 บันทึกยอดโพสต์เข้าระบบคู่ขนาน</button>
            <button class="btn-restore" onclick="restoreBackupData()">🔄 ดึงข้อมูลสำรองล่าสุด</button>
        </div>
    </div>

    <button class="btn-toggle-dash" onclick="toggleDashboard()">📊 ดูยอดโพสต์ประจำเดือนนี้</button>
    <button class="btn-export-excel" onclick="exportFirebaseToExcel()">🟢 ดาวน์โหลดประวัติโพสต์ทั้งหมด (Excel)</button>

    <div id="dashBoard" class="card" style="display:none;">
        <div class="dash-title">📊 สรุปยอดรวมเดือนนี้</div>
        <div id="dashContent" class="dash-grid"></div>
    </div>

    <div id="historyList"></div>
</div>

<script src="https://unpkg.com/firebase@10.7.1/firebase-app-compat.js"></script>
<script src="https://unpkg.com/firebase@10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
const firebaseConfig = { apiKey: "AIzaSyCSncboyEoURJMOSx9fk8qEClmuQ_PgwDI", authDomain: "save-data-92eca.firebaseapp.com", projectId: "save-data-92eca", storageBucket: "save-data-92eca.firebasestorage.app", messagingSenderId: "661096454777", appId: "1:661096454777:web:d8b4297db798e14b76d2a8" };

let db = null;
try {
    if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    }
} catch (e) { console.error("เชื่อมต่อ Firebase ไม่สำเร็จ: ", e); }

// 🏢 ฐานข้อมูลกลุ่มที่ 1 (คอนโด 9 รายการ - ตัด รีช พหลโยธิน 52 ออก และมี Diamond Ratchada Cool House)
const assetsGroup1_Condo = [
    "BANGKOK HORIZON รามคำแหง",
    "คอนโดชีวาทัย ฮอล์มาร์ค",
    "กรีเน่ คอนโด ดอนเมือง–สรงประภา",
    "Lumpini Ville แบริ่ง–ลาซาล",
    "กรีเน่ คอนโด ดอนเมือง–สรงประภา เฟส 1",
    "Kensington Place แจ้งวัฒนะ 13",
    "ทิพยฤกษ์",
    "Cool House Condo รัชดา 12",
    "Diamond Ratchada Cool House"
];

// 🏡 ฐานข้อมูลกลุ่มที่ 2 (บ้านและที่ดิน 12 รายการ - เพิ่ม บ้านเอื้ออาทรอรัญประเทศ)
const assetsGroup2_HouseLand = [
    "บ้านพี่แดง อรัญนคร3",
    "แม่ย่าพี่ปลา 14 ไร่",
    "แม่ย่าพี่ปลา 11 ไร่",
    "บ้านอรัญนคร 1",
    "ที่ดิน หลังอรัญนคร 1 ซ.ประสบโชค",
    "ที่ดินน้าจิต วังน้ำเย็น",
    "บ้านพี่หนึ่ง อรัญวิลล์",
    "ที่ดินบ้านนา นครนายก",
    "บ้านพรสิริ ขอนแก่น",
    "บ้านพี่ปองพระประแดง",
    "บ้านคุณมีน",
    "บ้านเอื้ออาทรอรัญประเทศ"
];

const uDelightAsset = "U DELIGHT 3 | ยู ดีไลท์ 3";
const dCondoAsset = "ดีคอนโด รามอินทรา";

const defaultTimesKW = ["10:00", "12:15", "18:30", "20:30"];
const defaultTimesSU = ["11:00", "13:30", "19:00", "21:00"];

let currentDocId = null;

function parseUserData(user, data) {
    let parsed = {};
    if (!data) return parsed;
    
    if (data[user] && typeof data[user] === 'object') {
        for (let i = 1; i <= 4; i++) {
            let pKey = `p${i}`;
            if (data[user][pKey]) {
                parsed[pKey] = {
                    name: data[user][pKey].name || data[user][pKey].n || data[user][pKey].prop || "",
                    time: data[user][pKey].time || data[user][pKey].t || "",
                    num: Number(data[user][pKey].num || data[user][pKey].count || data[user][pKey].c || 0)
                };
            }
        }
    }
    
    for (let i = 1; i <= 4; i++) {
        let pKey = `p${i}`;
        
        let nameVal = "";
        let possibleNameKeys = [
            `${user}_n${i}`, `${user}_name${i}`, `${user}_prop${i}`, `${user}_property${i}`, 
            `${user}${i}_n`, `${user}${i}_name`, `${user}${i}_prop`, 
            `${user}n${i}`, `${user}name${i}`, `${user}${i}name`
        ];
        for (let key of possibleNameKeys) {
            if (data[key] !== undefined) {
                nameVal = data[key];
                break;
            }
        }
        
        let timeVal = "";
        let possibleTimeKeys = [
            `${user}_t${i}`, `${user}_time${i}`, 
            `${user}${i}_t`, `${user}${i}_time`, 
            `${user}t${i}`, `${user}time${i}`, `${user}${i}time`
        ];
        for (let key of possibleTimeKeys) {
            if (data[key] !== undefined) {
                timeVal = data[key];
                break;
            }
        }
        
        let numVal = 0;
        let possibleNumKeys = [
            `${user}_num${i}`, `${user}_count${i}`, `${user}_c${i}`, 
            `${user}${i}_num`, `${user}${i}_count`, `${user}${i}_c`, 
            `${user}num${i}`, `${user}count${i}`, `${user}${i}num`
        ];
        for (let key of possibleNumKeys) {
            if (data[key] !== undefined) {
                numVal = data[key];
                break;
            }
        }
        
        if (!parsed[pKey]) {
            parsed[pKey] = { name: nameVal, time: timeVal, num: Number(numVal) || 0 };
        } else {
            if (!parsed[pKey].name) parsed[pKey].name = nameVal;
            if (!parsed[pKey].time) parsed[pKey].time = timeVal;
            if (!parsed[pKey].num) parsed[pKey].num = Number(numVal) || 0;
        }
    }
    
    return parsed;
}

function generateInputRows(user, data) {
    const container = document.getElementById(`${user}_rows`);
    if (!container) return;
    container.innerHTML = "";
    const uData = parseUserData(user, data);
    
    for (let i = 1; i <= 4; i++) {
        let rowData = { time: "", name: "", num: 0 };
        if (uData && uData[`p${i}`]) rowData = uData[`p${i}`];
        
        container.innerHTML += `
            <div class="row">
                <input type="text" class="input-time" id="${user}_t${i}" placeholder="เวลา" value="${rowData.time || ''}">
                <input type="text" class="input-name" id="${user}_n${i}" placeholder="พิมพ์ระบุชื่อทรัพย์สิน..." value="${rowData.name || ''}">
                <input type="number" id="${user}_num${i}" value="${rowData.num || 0}">
            </div>
        `;
    }
}

async function checkTodayStatus() {
    const dateVal = document.getElementById("date").value;
    if(!dateVal) return;
    
    document.getElementById("randomBox").style.display = "block";
    document.getElementById("inputSection").style.display = "none";
    document.getElementById("dashBoard").style.display = "none";
    if(!db) return;

    try {
        const snap = await db.collection("posts").where("date", "==", dateVal).get();
        if (!snap.empty) {
            currentDocId = snap.docs[0].id;
            const d = snap.docs[0].data();
            
            document.getElementById("randomBox").style.display = "none";
            document.getElementById("inputSection").style.display = "block";
            generateInputRows("kw", d);
            generateInputRows("su", d);
        }
        loadHistory();
    } catch (e) { console.error("โหลดข้อมูลผิดพลาด: ", e); }
}

async function startRandom() {
    const dateVal = document.getElementById("date").value;
    if(!dateVal) { alert("กรุณาเลือกวันที่ก่อนกดสุ่มค่ะ"); return; }
    if(!db) { alert("ไม่สามารถติดต่อฐานข้อมูลได้"); return; }

    const btn = document.getElementById("btnRandomAction");
    btn.disabled = true;
    btn.innerText = "⏳ กำลังดึงข้อมูลและล็อกแผนงาน...";

    try {
        // 1. ตรวจสอบประวัติการโพสต์เพื่อเรียงลำดับทรัพย์สินที่ไม่เคยลง หรือลงนานที่สุดขึ้นก่อน
        const snapHistory = await db.collection("posts").orderBy("date", "desc").get();
        
        let lastUsedMap = {};
        let yesterdayAssets = new Set();
        let targetDateObj = new Date(dateVal);
        
        snapHistory.forEach(doc => {
            const d = doc.data();
            if(!d.date) return;
            
            let dObj = new Date(d.date);
            let diffDays = Math.floor((targetDateObj - dObj) / (1000 * 60 * 60 * 24));
            
            const kwD = parseUserData("kw", d);
            const suD = parseUserData("su", d);
            
            const checkAndAdd = (item) => {
                if(item && item !== "ไม่มีแผนงานลงโพสต์") {
                    if(lastUsedMap[item] === undefined) lastUsedMap[item] = diffDays;
                    if(diffDays === 1) yesterdayAssets.add(item);
                }
            };

            for(let i=1; i<=4; i++) {
                if(kwD[`p${i}`]) checkAndAdd(kwD[`p${i}`].name);
                if(suD[`p${i}`]) checkAndAdd(suD[`p${i}`].name);
            }
        });

        // 2. คำนวณวันเว้นวัน (Alternate Days) ล็อก U DELIGHT 3 และ ดีคอนโด รามอินทรา
        const baseDate = new Date("2026-08-16");
        const dayOffset = Math.floor((targetDateObj - baseDate) / (1000 * 60 * 60 * 24));
        
        let lockedToday = (dayOffset % 2 === 0) ? uDelightAsset : dCondoAsset;

        // 3. เรียงลำดับทรัพย์ตามความถี่ ยิ่งเว้นนานยิ่งมีโอกาสถูกสุ่มก่อน
        const sortByRecency = (arr) => {
            return [...arr].sort((a, b) => {
                let recA = lastUsedMap[a] !== undefined ? lastUsedMap[a] : 9999;
                let recB = lastUsedMap[b] !== undefined ? lastUsedMap[b] : 9999;
                if(recA !== recB) return recB - recA;
                return 0.5 - Math.random();
            });
        };

        // กรองรายการที่ไม่ติดเงื่อนไขซ้ำวันก่อนหน้า
        let poolG1 = sortByRecency(assetsGroup1_Condo.filter(item => item !== lockedToday && !yesterdayAssets.has(item)));
        let poolG2 = sortByRecency(assetsGroup2_HouseLand.filter(item => item !== lockedToday && !yesterdayAssets.has(item)));
        
        if (poolG1.length < 4) poolG1 = sortByRecency(assetsGroup1_Condo.filter(item => item !== lockedToday));
        if (poolG2.length < 3) poolG2 = sortByRecency(assetsGroup2_HouseLand.filter(item => item !== lockedToday));

        // 4. สุ่มเลือกเน้นคอนโดมากกว่า (ดึง คอนโด 4 รายการ + บ้าน/ที่ดิน 3 รายการ + 1 ทรัพย์ล็อก = 8 รายการ/วัน)
        let selected7 = [...poolG1.slice(0, 4), ...poolG2.slice(0, 3)];
        selected7.sort(() => 0.5 - Math.random());
        
        let finalDailyList = [lockedToday, ...selected7];
        finalDailyList.sort(() => 0.5 - Math.random());

        let kw_final = finalDailyList.slice(0, 4);
        let su_final = finalDailyList.slice(4, 8);

        let uploadData = { date: dateVal };
        for(let i=1; i<=4; i++) {
            uploadData[`kw_n${i}`] = kw_final[i-1] || "ไม่มีแผนงานลงโพสต์";
            uploadData[`kw_t${i}`] = defaultTimesKW[i-1] || "--:--";
            uploadData[`kw_num${i}`] = 0;
            
            uploadData[`su_n${i}`] = su_final[i-1] || "ไม่มีแผนงานลงโพสต์";
            uploadData[`su_t${i}`] = defaultTimesSU[i-1] || "--:--";
            uploadData[`su_num${i}`] = 0;
        }
        
        await db.collection("posts").add(uploadData);
        await checkTodayStatus();
    } catch(e) { 
        alert("เกิดข้อผิดพลาดในการสุ่ม: " + e.message); 
    } finally {
        btn.disabled = false;
        btn.innerText = "✨ ดึงแผนงานล็อกทรัพย์สินวันนี้";
    }
}

async function searchAssetDays() {
    const key = document.getElementById("searchKey").value.trim();
    if(!key) return;
    if(!db) return;
    
    try {
        const snap = await db.collection("posts").orderBy("date", "desc").get();
        let matchDates = [];
        snap.forEach(doc => {
            const d = doc.data();
            let found = false;
            const kwData = parseUserData("kw", d);
            const suData = parseUserData("su", d);
            
            for(let i=1; i<=4; i++) {
                if(kwData[`p${i}`] && kwData[`p${i}`].name && kwData[`p${i}`].name.includes(key)) found = true;
                if(suData[`p${i}`] && suData[`p${i}`].name && suData[`p${i}`].name.includes(key)) found = true;
            }
            if(found) matchDates.push(d.date);
        });
        
        const resBox = document.getElementById("searchResult");
        resBox.style.display = "block";
        if(matchDates.length > 0) {
            resBox.innerHTML = `<strong>📌 วันที่เคยลงโพสต์ของ "${key}":</strong><br>` + matchDates.map(d => `• ${d}`).join('<br>');
        } else {
            resBox.innerHTML = `❌ ไม่พบประวัติการบันทึกของทรัพย์สินชื่อ "${key}"`;
        }
    } catch(e) { alert("ค้นหาผิดพลาด: " + e.message); }
}

async function saveData() { 
    if(!db || !currentDocId) { alert("ไม่พบข้อมูลเอกสารสำหรับบันทึกวันนี้ค่ะ"); return; }
    let updateData = {};
    
    for(let i=1; i<=4; i++) {
        const kw_t = document.getElementById(`kw_t${i}`).value;
        const kw_n = document.getElementById(`kw_n${i}`).value;
        const kw_num = Number(document.getElementById(`kw_num${i}`).value);
        
        const su_t = document.getElementById(`su_t${i}`).value;
        const su_n = document.getElementById(`su_n${i}`).value;
        const su_num = Number(document.getElementById(`su_num${i}`).value);

        updateData[`kw_t${i}`] = kw_t;
        updateData[`kw_n${i}`] = kw_n;
        updateData[`kw_num${i}`] = kw_num;
        
        updateData[`su_t${i}`] = su_t;
        updateData[`su_n${i}`] = su_n;
        updateData[`su_num${i}`] = su_num;

        updateData[`kw.p${i}.time`] = kw_t;
        updateData[`kw.p${i}.name`] = kw_n;
        updateData[`kw.p${i}.num`] = kw_num;
        
        updateData[`su.p${i}.time`] = su_t;
        updateData[`su.p${i}.name`] = su_n;
        updateData[`su.p${i}.num`] = su_num;
    }

    try {
        await db.collection("posts").doc(currentDocId).update(updateData); 
        alert("✨ บันทึกยอดสะสมประจำวันเรียบร้อยแล้วค่ะ!"); 
        await checkTodayStatus(); 
    } catch(err) {
        alert("เกิดข้อผิดพลาดในการบันทึก: " + err.message);
    }
}

async function restoreBackupData() { checkTodayStatus(); }

async function toggleDashboard() {
    const dashBox = document.getElementById("dashBoard");
    if (!dashBox) return;
    if (dashBox.style.display === "block") {
        dashBox.style.display = "none";
        return;
    }
    
    if(!db) return;
    try {
        const dateInput = document.getElementById("date").value;
        const month = dateInput.substring(0, 7); 
        const snap = await db.collection("posts").get(); 
        let stats = {}; 
        snap.forEach(doc => { 
            const d = doc.data(); 
            if(d.date && d.date.startsWith(month)) { 
                for(let user of ['kw', 'su']) {
                    const uData = parseUserData(user, d);
                    for(let i=1; i<=4; i++) {
                        if(uData[`p${i}`] && uData[`p${i}`].name && uData[`p${i}`].name !== "ไม่มีแผนงานลงโพสต์") {
                            stats[uData[`p${i}`].name] = (stats[uData[`p${i}`].name] || 0) + (Number(uData[`p${i}`].num) || 0);
                        }
                    }
                }
            } 
        });
        document.getElementById("dashContent").innerHTML = Object.entries(stats).sort((a,b) => b[1]-a[1]).map(([n, c]) => `<div class="dash-item">${n}</div><div class="dash-item" style="text-align:right"><b>${c}</b></div>`).join('') || "ไม่มีข้อมูล";
        dashBox.style.display = "block";
    } catch (e) { alert("โหลดแดชบอร์ดผิดพลาด: " + e.message); }
}

async function exportFirebaseToExcel() {
    if(!db) { alert("ระบบไม่ได้เชื่อมต่อกับฐานข้อมูล"); return; }
    if(!confirm("คุณต้องการดาวน์โหลดประวัติข้อมูลเก่าทั้งหมดจากระบบเป็นไฟล์ Excel ใช่ไหมคะ?")) return;
    
    try {
        const snap = await db.collection("posts").orderBy("date", "asc").get();
        let excelRows = [];
        
        snap.forEach(doc => {
            const d = doc.data();
            if(!d.date) return;
            
            const kwData = parseUserData("kw", d);
            const suData = parseUserData("su", d);
            
            for(let i=1; i<=4; i++) {
                if(kwData[`p${i}`] && kwData[`p${i}`].name) {
                    excelRows.push({
                        "วันที่": d.date,
                        "ผู้บันทึก": "พี่ขวัญ",
                        "ลำดับโพสต์": `โพสต์ที่ ${i}`,
                        "เวลาลงโพสต์": kwData[`p${i}`].time || "--:--",
                        "ชื่อทรัพย์สิน": kwData[`p${i}`].name,
                        "จำนวนยอดโพสต์ (ครั้ง)": kwData[`p${i}`].num || 0
                    });
                }
            }
            
            for(let i=1; i<=4; i++) {
                if(suData[`p${i}`] && suData[`p${i}`].name) {
                    excelRows.push({
                        "วันที่": d.date,
                        "ผู้บันทึก": "พี่สุ",
                        "ลำดับโพสต์": `โพสต์ที่ ${i}`,
                        "เวลาลงโพสต์": suData[`p${i}`].time || "--:--",
                        "ชื่อทรัพย์สิน": suData[`p${i}`].name,
                        "จำนวนยอดโพสต์ (ครั้ง)": suData[`p${i}`].num || 0
                    });
                }
            }
        });
        
        if(excelRows.length === 0) { alert("ไม่พบข้อมูลประวัติในระบบที่จะส่งออกค่ะ"); return; }
        
        const worksheet = XLSX.utils.json_to_sheet(excelRows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "ประวัติยอดโพสต์สะสม");
        
        worksheet['!cols'] = [{ wch: 15 }, { wch: 12 }, { wch: 12 }, { wch: 15 }, { wch: 45 }, { wch: 22 }];
        XLSX.writeFile(workbook, `ประวัติยอดโพสต์_Firebase_${new Date().toISOString().slice(0,10)}.xlsx`);
        alert("🟢 ดาวน์โหลดไฟล์ประวัติ Excel เรียบร้อยแล้วค่ะ!");
    } catch (error) { alert("เกิดข้อผิดพลาดในการส่งออก Excel: " + error.message); }
}

async function loadHistory() {
    if(!db) return;
    try {
        const snap = await db.collection("posts").orderBy("date", "desc").limit(10).get(); 
        let html = ""; 
        snap.forEach(doc => { 
            const d = doc.data(); 
            if(d.date) {
                const kwData = parseUserData("kw", d);
                const suData = parseUserData("su", d);
                
                html += `<div class="history-card">
                    <strong style="color:var(--text-dark); font-size:0.95rem;">🗓 วันที่ ${d.date}</strong> 
                    <button class="btn-action" style="margin-left:10px;" onclick="editEntry('${doc.id}')">✏️</button> 
                    <button class="btn-action btn-delete" onclick="deleteEntry('${doc.id}')">🗑️</button>
                    
                    <div style="color:var(--royal-navy); margin-top:12px; font-weight:bold; font-size:0.95rem;">👤 พี่ขวัญ</div>`;
                for(let i=1; i<=4; i++) {
                    if(kwData[`p${i}`] && kwData[`p${i}`].name) {
                        html += `<div class="h-row" style="color:var(--text-dark)"><span>${kwData[`p${i}`].time || '--:--'}</span><span>${kwData[`p${i}`].name}</span><span><b>${kwData[`p${i}`].num}</b></span></div>`;
                    }
                }
                
                html += `<div style="color:var(--royal-navy); margin-top:12px; font-weight:bold; font-size:0.95rem;">👤 พี่สุ</div>`;
                for(let i=1; i<=4; i++) {
                    if(suData[`p${i}`] && suData[`p${i}`].name) {
                        html += `<div class="h-row" style="color:var(--text-dark)"><span>${suData[`p${i}`].time || '--:--'}</span><span>${suData[`p${i}`].name}</span><span><b>${suData[`p${i}`].num}</b></span></div>`;
                    }
                }
                html += `</div>`;
            } 
        });
        document.getElementById("historyList").innerHTML = html;
    } catch (e) { console.error(e); }
}

async function editEntry(id) { 
    if(!db) return; 
    try {
        const doc = await db.collection("posts").doc(id).get(); 
        if(doc.exists) {
            document.getElementById("date").value = doc.data().date; 
            checkTodayStatus(); 
        }
    } catch (e) { console.error(e); }
}

async function deleteEntry(id) { 
    if(!db) return; 
    if(confirm("ต้องการลบประวัติรายการนี้ใช่ไหม?")) { 
        try {
            await db.collection("posts").doc(id).delete(); 
            checkTodayStatus(); 
        } catch (e) { alert("ลบข้อมูลไม่สำเร็จ: " + e.message); }
    } 
}

window.onload = () => { 
    const tomorrow = new Date(); 
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById("date").value = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${String(tomorrow.getDate()).padStart(2, '0')}`; 
    checkTodayStatus();
};
</script>
