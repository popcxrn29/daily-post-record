<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Post Diary - Modern Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #F8F9FA; 
            --card-bg: #FFFFFF;
            --text-dark: #1C2833; 
            --royal-navy: #1B4F72; 
            --rose-gold: #B47B84; 
            --rose-gold-light: #F9EBEA;
            --border-luxury: #E5E8E8;
            --shadow-luxury: 0 10px 30px rgba(27, 79, 114, 0.05);
        }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 16px; 
            color: var(--text-dark); 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        
        .main-container { width: 100%; max-width: 420px; }
        
        .card { 
            background: var(--card-bg); 
            border-radius: 24px; 
            padding: 22px; 
            box-shadow: var(--shadow-luxury); 
            margin-bottom: 16px; 
            border: 1px solid rgba(180, 123, 132, 0.1);
        }
        
        .header-box { text-align: center; padding: 20px; border-bottom: 3px solid var(--rose-gold); }
        .header-title { color: var(--royal-navy); font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        #date { 
            width: 60%; 
            padding: 10px; 
            border-radius: 14px; 
            border: 1px solid var(--border-luxury); 
            background: #FAFAFA; 
            font-size: 1.05rem; 
            font-weight: 700;
            color: var(--royal-navy);
            text-align: center;
            outline: none;
        }
        
        .user-title { font-size: 1.1rem; font-weight: 700; color: var(--royal-navy); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-left: 4px solid var(--rose-gold); padding-left: 10px; }
        
        .row { 
            display: grid; 
            grid-template-columns: 75px 1fr 34px 55px; 
            gap: 8px; 
            margin-bottom: 12px; 
            align-items: center; 
        }
        
        input[readonly] { 
            font-size: 0.95rem; 
            font-weight: 700; 
            color: var(--text-dark); 
            background: transparent; 
            border: none; 
            width: 100%;
            text-overflow: ellipsis;
            padding-left: 4px;
        }
        
        .input-time { 
            padding: 8px 4px; 
            border: 1px solid var(--border-luxury); 
            border-radius: 12px; 
            text-align: center; 
            font-size: 0.85rem; 
            width: 100%; 
            box-sizing: border-box;
            color: var(--royal-navy);
            background: #FAFAFA;
            font-weight: 600;
        }
        
        input[type="number"] { 
            padding: 8px 4px; 
            border: 1px solid var(--border-luxury); 
            border-radius: 12px; 
            text-align: center; 
            font-size: 1rem; 
            font-weight: 700; 
            width: 100%; 
            box-sizing: border-box;
            color: var(--royal-navy);
            background: #FAFAFA;
        }
        
        .btn-random {
            background: linear-gradient(135deg, var(--royal-navy), #2C3E50); color: #FFFFFF; border: none; 
            padding: 14px; border-radius: 16px; width: 100%; font-weight: 700; font-size: 1rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(27, 79, 114, 0.2);
        }
        
        .btn-save { 
            background: linear-gradient(135deg, var(--royal-navy), #2471A3); color: #FFFFFF; border: none; 
            padding: 14px; border-radius: 16px; width: 100%; font-weight: 700; font-size: 1rem; cursor: pointer; margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(27, 79, 114, 0.2);
        }
        .btn-restore { 
            background: #FFFFFF; color: var(--rose-gold); border: 1px solid var(--rose-gold); 
            padding: 12px; border-radius: 16px; width: 100%; font-weight: 700; font-size: 0.95rem; cursor: pointer;
        }
        
        .btn-action { border: none; background: #F2F4F4; color: var(--royal-navy); padding: 7px; font-size: 0.85rem; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-action:hover { background: var(--rose-gold-light); color: var(--rose-gold); }
        .btn-delete { background: #FADBD8; color: #CB4335; }
        
        .dash-title { color: var(--royal-navy); font-weight: 700; font-size: 1.1rem; margin-bottom: 14px; border-left: 4px solid var(--rose-gold); padding-left: 10px; }
        .dash-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 0.95rem; }
        .dash-item { border-bottom: 1px solid #F2F4F4; padding: 10px 0; font-weight: 600; color: var(--text-dark); }
        
        .history-card { background: #FFFFFF; border-radius: 20px; padding: 18px; margin-bottom: 14px; border-top: 4px solid var(--rose-gold); font-size: 0.85rem; box-shadow: var(--shadow-luxury); }
        .h-row { display: grid; grid-template-columns: 65px 1fr 50px; padding: 8px 0; border-bottom: 1px dashed var(--border-luxury); align-items: center; }
        
        .search-box { display: flex; gap: 8px; }
        .search-input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-luxury); border-radius: 14px; font-size: 0.9rem; outline: none; background: #FAFAFA; color: var(--text-dark); }
        .btn-search { background: var(--royal-navy); color: white; border: none; padding: 0 20px; border-radius: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(27, 79, 114, 0.15); }
        .search-result { background: #EBF5FB; padding: 14px; border-radius: 16px; margin-top: 12px; font-size: 0.9rem; display: none; border: 1px solid #AED6F1; color: var(--royal-navy); }
    </style>
</head>
<body>

<div class="main-container">
    <div class="card" style="padding: 14px;">
        <div class="search-box">
            <input type="text" id="searchKey" class="search-input" placeholder="🔍 ค้นหาประวัติวันลงโพสต์ของทรัพย์...">
            <button class="btn-search" onclick="searchAssetDays()">ค้นหา</button>
        </div>
        <div id="searchResult" class="search-result"></div>
    </div>

    <div class="card header-box">
        <div class="header-title">⚜️ Post Diary Premium</div>
        <input id="date" type="date" onchange="checkTodayStatus()">
    </div>

    <div id="randomBox" class="card" style="display:block; text-align:center;">
        <button class="btn-random" onclick="startRandom()">✨ สุ่มแผนงานวันนี้ (คนละ 4 ช่วงเวลา)</button>
    </div>

    <div id="inputSection" class="card" style="display: none;">
        <div class="user-title">👤 แผนงานประจำวัน: พี่ขวัญ</div>
        <div id="kw_rows"></div>
        
        <hr style="border:0; border-top:1px solid var(--border-luxury); margin:22px 0;">
        
        <div class="user-title">👤 แผนงานประจำวัน: พี่สุ</div>
        <div id="su_rows"></div>
        
        <div style="margin-top: 26px;">
            <button class="btn-save" onclick="saveData()">💾 บันทึกยอดโพสต์เข้าระบบคู่ขนาน</button>
            <button class="btn-restore" onclick="restoreBackupData()">🔄 ดึงข้อมูลสำรองล่าสุด</button>
        </div>
    </div>

    <div id="dashBoard" class="card" style="display:none;">
        <div class="dash-title">📊 สรุปยอดรวมเดือนนี้</div>
        <div id="dashContent" class="dash-grid"></div>
    </div>

    <div id="historyList"></div>
</div>

<script src="https://unpkg.com/firebase@10.7.1/firebase-app-compat.js"></script>
<script src="https://unpkg.com/firebase@10.7.1/firebase-firestore-compat.js"></script>

<script>
window.onerror = function(message, source, lineno, colno, error) { return true; };

const firebaseConfig = { apiKey: "AIzaSyCSncboyEoURJMOSx9fk8qEClmuQ_PgwDI", authDomain: "save-data-92eca.firebaseapp.com", projectId: "save-data-92eca", storageBucket: "save-data-92eca.firebasestorage.app", messagingSenderId: "661096454777", appId: "1:661096454777:web:d8b4297db798e14b76d2a8" };

let db = null;
try {
    if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    }
} catch (e) { console.error(e); }

// รายชื่อฐานข้อมูลทรัพย์สินจำแนกตามรูปถ่าย (กรองเกรด C ทิ้งถาวร)
const assetsDatabase = {
    AA: [
        "U DELIGHT 3 | ยู ดีไลท์ 3", 
        "Happy condo รัชดา 18", 
        "Plum Condo Rangsit Fresh : พลัมคอนโด รังสิต"
    ],
    A: [
        "บ้านพี่แดง อรัญนคร3", 
        "คอนโดชีวาทัย ฮอลล์มาร์ค ลาดพร้าว-โชคชัย4(ฝน)", 
        "ที่ดิน หลังอรัญนคร 1 ซ.ประสบโชค", 
        "ที่ดินพื้น 3 งาน", 
        "คอนโด The Base Park East Sukhumvit 77", 
        "คอนโด Aston", 
        "ลุมพินี คอนโดทาวน์ รามอินทรา-หลักสี่", 
        "Plum Condo นวมินทร์", 
        "Lumpini Ville แบริ่ง-ลาซาล", 
        "กรีเน่ คอนโด ตอนเมือง-สรงประภา", 
        "กรีเน่ คอนโด ตอนเมือง-สรงประภา เฟส 1", 
        "Kensington Place แจ้งวัฒนะ 13", 
        "ลุมพินี คอนโดทาวน์ รามอินทรา - ลาดปลาเค้า 2", 
        "The IRIS พระราม 9", 
        "ทาวน์โฮม 3 ชั้น 4 ห้องนอน 4 ห้องน้ำ"
    ],
    B: [
        "แม่ย่าพี่ปลา 14 ไร่", 
        "แม่ย่าพี่ปลา 11 ไร่", 
        "ที่ดินน้าจิต วังน้ำเย็น", 
        "ทด.ป่าใย ท่าข้าม", 
        "บ้านอรัญนคร 1 (คุณแคท )", 
        "บ้านพี่หนึ่ง อรัญวิลล์", 
        "ที่ดิน (โบท)", 
        "ที่ดินบ้านนา นครนายก", 
        "บ้านพรสิริ ขอนแก่น", 
        "BANGKOK HORIZON รามคำแหง", 
        "บ้านทาวน์โฮม พฤกษา 9- รังสิต คลอง 3", 
        "บ้านเอื้ออาทรอรัญประเทศ"
    ]
};

// ล็อกตัวบังคับสุ่มทุกวัน
const mandatoryAssets = ["U DELIGHT 3 | ยู ดีไลท์ 3", "Happy condo รัชดา 18"];

let currentDocId = null;

function parseUserData(user, data) {
    let parsed = {};
    if (!data || !data[user]) return parsed;
    if (data[user].p1) return data[user];
    
    // แปลงโครงสร้างเดิมรองรับประวัติเก่า
    if (data[user].m || data[user].n || data[user].e) {
        parsed.p1 = { name: data[user].m?.name || "เช้า", time: data[user].m?.time || "", num: Number(data[user].m?.num) || 0 };
        parsed.p2 = { name: data[user].n?.name || "เที่ยง", time: data[user].n?.time || "", num: Number(data[user].n?.num) || 0 };
        parsed.p3 = { name: data[user].e?.name || "เย็น", time: data[user].e?.time || "", num: Number(data[user].e?.num) || 0 };
        parsed.p4 = { name: "", time: "", num: 0 };
    }
    return parsed;
}

function generateInputRows(user, data) {
    const container = document.getElementById(`${user}_rows`);
    container.innerHTML = "";
    const uData = parseUserData(user, data);
    
    // เปลี่ยนการแสดงผลระบบล็อกหน้าจอเป็นคนละ 4 ช่วงเวลา
    for (let i = 1; i <= 4; i++) {
        let rowData = { time: "", name: "", num: 0 };
        if (uData && uData[`p${i}`]) rowData = uData[`p${i}`];
        
        container.innerHTML += `
            <div class="row">
                <input type="text" class="input-time" id="${user}_t${i}" placeholder="พิมพ์เวลา" value="${rowData.time || ''}">
                <input id="${user}_n${i}" value="${rowData.name || ''}" readonly>
                <button class="btn-action" onclick="editAssetName('${user}_n${i}')">✏️</button>
                <input id="${user}_num${i}" type="number" value="${rowData.num || 0}">
            </div>
        `;
    }
}

function editAssetName(id) {
    const input = document.getElementById(id);
    const newName = prompt("✏️ แก้ไขชื่อทรัพย์สินชั่วคราวประจำวันนี้:", input.value);
    if (newName !== null && newName.trim() !== "") input.value = newName.trim();
}

async function checkTodayStatus() {
    const dateVal = document.getElementById("date").value;
    if(!dateVal) return;
    
    document.getElementById("randomBox").style.display = "block";
    document.getElementById("inputSection").style.display = "none";
    if(!db) return;

    try {
        const snap = await db.collection("posts").where("date", "==", dateVal).get();
        if (!snap.empty) {
            currentDocId = snap.docs[0].id;
            const d = snap.docs[0].data();
            
            document.getElementById("randomBox").style.display = "none";
            document.getElementById("inputSection").style.display = "block";
            generateInputRows("kw", d);
            generateInputRows("su", d);
        }
        updateDashboard(); loadHistory();
    } catch (e) { console.error(e); }
}

async function startRandom() {
    const dateVal = document.getElementById("date").value;
    if(!dateVal) return;
    if(!db) return;

    try {
        // ตรวจสอบวันก่อนหน้าเพื่อทำระบบสลับคละฝั่ง (วันเว้นวัน) ของ ยูดีไลท์ และ แฮปปี้คอนโด
        let lastKwAssets = [];
        const yesterday = new Date(dateVal);
        yesterday.setDate(yesterday.getDate() - 1);
        const yyyymmdd_1 = yesterday.toISOString().split('T')[0];

        const prevSnap = await db.collection("posts").where("date", "==", yyyymmdd_1).get();
        if (!prevSnap.empty) {
            const prevData = prevSnap.docs[0].data();
            if (prevData.kw) {
                for(let i=1; i<=4; i++) {
                    if(prevData.kw[`p${i}`]) lastKwAssets.push(prevData.kw[`p${i}`].name);
                }
            }
        }

        // คละเรียงลำดับทรัพย์สิน เกรด AA -> เกรด A -> เกรด B ตามความต้องการ
        let poolAA = [...assetsDatabase.AA].sort(() => 0.5 - Math.random());
        let poolA = [...assetsDatabase.A].sort(() => 0.5 - Math.random());
        let poolB = [...assetsDatabase.B].sort(() => 0.5 - Math.random());

        // ประกอบรายการสุ่มโดยดึง AA และ A ให้หมดก่อน
        let normalPool = [...poolAA, ...poolA, ...poolB];
        // กรองตัวล็อกหลักออกชั่วคราวเพื่อแยกไปจัดสรรสลับฝั่งพี่ขวัญ/พี่สุ
        normalPool = normalPool.filter(x => !mandatoryAssets.includes(x));

        // คัดเลือกรายการสุ่มสำหรับวันนี้ทั้งหมด 6 รายการที่เหลือ
        let finalSelection = [];
        while(finalSelection.length < 6 && normalPool.length > 0) {
            finalSelection.push(normalPool.shift());
        }

        // จัดสรรสลับคละฝั่งตัวล็อกภาคบังคับทุกวัน
        let kw_picks = [];
        let su_picks = [];

        // เงื่อนไขสลับสลับวันเว้นวัน
        if (lastKwAssets.includes(mandatoryAssets[0])) {
            kw_picks.push(mandatoryAssets[1]);
            su_picks.push(mandatoryAssets[0]);
        } else {
            kw_picks.push(mandatoryAssets[0]);
            su_picks.push(mandatoryAssets[1]);
        }

        // แบ่งส่วนทรัพย์สินที่เหลือคนละ 3 ชิ้น รวมเป็นคนละ 4 ช่องพอดีเป๊ะ
        kw_picks.push(finalSelection[0], finalSelection[1], finalSelection[2]);
        su_picks.push(finalSelection[3], finalSelection[4], finalSelection[5]);

        // สับเปลี่ยนตำแหน่งภายในช่องเวลาไม่ให้จำเจ
        kw_picks.sort(() => 0.5 - Math.random());
        su_picks.sort(() => 0.5 - Math.random());

        let uploadData = { date: dateVal, kw: {}, su: {} };
        for(let i=1; i<=4; i++) {
            uploadData.kw[`p${i}`] = { name: kw_picks[i-1], time: "", num: 0 };
            uploadData.su[`p${i}`] = { name: su_picks[i-1], time: "", num: 0 };
        }
        
        await db.collection("posts").add(uploadData);
        checkTodayStatus();
    } catch(e) { 
        alert("เกิดข้อผิดพลาดในการสุ่มจัดเกรดกรุณาลองใหม่ค่ะ"); 
    }
}

async function searchAssetDays() {
    const key = document.getElementById("searchKey").value.trim();
    if(!key) return;
    if(!db) return;
    
    try {
        const snap = await db.collection("posts").orderBy("date", "desc").get();
        let matchDates = [];
        snap.forEach(doc => {
            const d = doc.data();
            let found = false;
            for(let user of ['kw', 'su']) {
                const uData = parseUserData(user, d);
                for(let i=1; i<=4; i++) {
                    if(uData[`p${i}`] && uData[`p${i}`].name.includes(key)) found = true;
                }
            }
            if(found) matchDates.push(d.date);
        });
        
        const resBox = document.getElementById("searchResult");
        resBox.style.display = "block";
        if(matchDates.length > 0) {
            resBox.innerHTML = `<strong>📌 วันที่เคยลงโพสต์ของ "${key}":</strong><br>` + matchDates.map(d => `• ${d}`).join('<br>');
        } else {
            resBox.innerHTML = `❌ ไม่พบประวัติการบันทึกของทรัพย์สินชื่อ "${key}"`;
        }
    } catch(e) { console.error(e); }
}

async function saveData() { 
    if(!db) return;
    let updateData = {};
    
    for(let i=1; i<=4; i++) {
        updateData[`kw.p${i}.time`] = document.getElementById(`kw_t${i}`).value;
        updateData[`kw.p${i}.name`] = document.getElementById(`kw_n${i}`).value;
        updateData[`kw.p${i}.num`] = Number(document.getElementById(`kw_num${i}`).value);
        updateData[`su.p${i}.time`] = document.getElementById(`su_t${i}`).value;
        updateData[`su.p${i}.name`] = document.getElementById(`su_n${i}`).value;
        updateData[`su.p${i}.num`] = Number(document.getElementById(`su_num${i}`).value);
    }

    try {
        await db.collection("posts").doc(currentDocId).update(updateData); 
        alert("✨ บันทึกข้อมูลประจำวันเรียบร้อยแล้วค่ะ!"); 
        checkTodayStatus(); 
    } catch(err) {
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้งค่ะ");
    }
}

async function restoreBackupData() { if(!db) return; checkTodayStatus(); }

async function updateDashboard() {
    if(!db) return;
    try {
        const dateInput = document.getElementById("date").value;
        const month = dateInput.substring(0, 7); 
        const snap = await db.collection("posts").get(); 
        let stats = {}; 
        snap.forEach(doc => { 
            const d = doc.data(); 
            if(d.date && d.date.startsWith(month)) { 
                for(let user of ['kw', 'su']) {
                    const uData = parseUserData(user, d);
                    for(let i=1; i<=4; i++) {
                        if(uData[`p${i}`] && uData[`p${i}`].name) {
                            stats[uData[`p${i}`].name] = (stats[uData[`p${i}`].name] || 0) + (Number(uData[`p${i}`].num) || 0);
                        }
                    }
                }
            } 
        });
        document.getElementById("dashContent").innerHTML = Object.entries(stats).sort((a,b) => b[1]-a[1]).map(([n, c]) => `<div class="dash-item">${n}</div><div class="dash-item" style="text-align:right"><b>${c}</b></div>`).join('') || "ไม่มีข้อมูล";
        document.getElementById("dashBoard").style.display = "block";
    } catch (e) {}
}

async function loadHistory() {
    if(!db) return;
    try {
        const snap = await db.collection("posts").orderBy("date", "desc").get(); 
        let html = ""; 
        snap.forEach(doc => { 
            const d = doc.data(); 
            if(d.date) {
                const kwData = parseUserData("kw", d);
                const suData = parseUserData("su", d);
                
                html += `<div class="history-card"><strong style="color:var(--text-dark); font-size:0.95rem;">🗓 วันที่ ${d.date}</strong> <button class="btn-action" style="display:inline-block; margin-left:10px;" onclick="editEntry('${doc.id}')">✏️</button> <button class="btn-action btn-delete" style="display:inline-block;" onclick="deleteEntry('${doc.id}')">🗑️</button>`;
                
                html += `<div style="color:var(--royal-navy); margin-top:12px; font-weight:bold; font-size:0.95rem;">👤 พี่ขวัญ</div>`;
                for(let i=1; i<=4; i++) {
                    if(kwData[`p${i}`] && kwData[`p${i}`].name) html += `<div class="h-row" style="color:var(--text-dark)"><span>${kwData[`p${i}`].time || '--:--'}</span><span>${kwData[`p${i}`].name}</span><span><b>${kwData[`p${i}`].num}</b></span></div>`;
                }
                
                html += `<div style="color:var(--royal-navy); margin-top:12px; font-weight:bold; font-size:0.95rem;">👤 พี่สุ</div>`;
                for(let i=1; i<=4; i++) {
                    if(suData[`p${i}`] && suData[`p${i}`].name) html += `<div class="h-row" style="color:var(--text-dark)"><span>${suData[`p${i}`].time || '--:--'}</span><span>${suData[`p${i}`].name}</span><span><b>${suData[`p${i}`].num}</b></span></div>`;
                }
                html += `</div>`;
            } 
        });
        document.getElementById("historyList").innerHTML = html;
    } catch (e) {}
}

async function editEntry(id) { if(!db)return; const doc = await db.collection("posts").doc(id).get(); document.getElementById("date").value = doc.data().date; checkTodayStatus(); }
async function deleteEntry(id) { if(!db)return; if(confirm("ต้องการลบประวัติรายการนี้ใช่ไหม?")) { await db.collection("posts").doc(id).delete(); checkTodayStatus(); } }

window.onload = () => { 
    const now = new Date(); document.getElementById("date").value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`; 
    checkTodayStatus();
};
</script>
</body>
