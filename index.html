<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Post Diary - Modern Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-gradient: linear-gradient(135deg, #FDFBFB 0%, #EBEDEE 100%);
            --card-bg: #FFFFFF;
            --text-dark: #2C3E50;
            --text-muted: #7F8C8D;
            --kw-primary: #1B4F72; /* Royal Navy เข้มตัดชัด */
            --su-primary: #78281F; /* Deep Rose/Burgundy หรูหรา */
            --accent-gold: #D4AC0D; 
            --luxury-pink: #FADBD8;
            --border-color: #E5E7E9;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: var(--bg-gradient); 
            margin: 0; 
            padding: 15px; 
            color: var(--text-dark); 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }
        
        .main-container { width: 100%; max-width: 430px; }
        
        .card { 
            background: var(--card-bg); 
            border-radius: 24px; 
            padding: 20px; 
            box-shadow: var(--shadow); 
            margin-bottom: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }
        
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        #date { 
            width: 60%; 
            padding: 10px; 
            border-radius: 14px; 
            border: 1px solid var(--border-color); 
            background: #F9EBEA; 
            font-size: 1rem; 
            font-weight: bold;
            color: var(--su-primary);
            text-align: center;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        
        input[readonly] { 
            font-size: 0.95rem; 
            font-weight: 600; 
            color: var(--text-dark); 
            background: transparent; 
            border: none; 
            width: 100%;
            text-overflow: ellipsis;
        }
        
        .row { 
            display: grid; 
            grid-template-columns: 75px 1fr 35px 55px; 
            gap: 8px; 
            margin-bottom: 10px; 
            align-items: center; 
            background: #F8F9F9;
            padding: 6px 10px;
            border-radius: 14px;
            border: 1px solid #F2F4F4;
        }
        
        input[type="number"], .input-time { 
            padding: 8px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            text-align: center; 
            font-size: 0.9rem; 
            font-weight: 700; 
            width: 100%; 
            box-sizing: border-box;
            background: #FFFFFF;
            color: var(--text-dark);
        }
        
        .input-time { 
            text-align: center; 
            font-weight: 500; 
            color: #1A5276;
            border: 1px dashed #A9CCE3;
        }
        
        .btn-random, .btn-save { 
            background: linear-gradient(135deg, #641E16 0%, #78281F 100%); 
            color: #FFFFFF; 
            border: none; 
            padding: 14px; 
            border-radius: 16px; 
            width: 100%; 
            font-weight: 700; 
            font-size: 1rem;
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(120, 40, 31, 0.2);
            transition: all 0.2s;
        }
        .btn-random:active, .btn-save:active { transform: scale(0.98); }
        
        .btn-restore { 
            background: #FFFFFF; 
            color: var(--text-muted); 
            border: 1px solid var(--border-color); 
            padding: 10px; 
            border-radius: 14px; 
            width: 100%; 
            font-weight: 500; 
            font-size: 0.85rem;
            cursor: pointer; 
            margin-top: 10px; 
        }
        
        .btn-action { 
            border: none;
            background: #EAECEE;
            color: var(--text-dark);
            padding: 6px; 
            font-size: 0.8rem; 
            border-radius: 8px; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-action:hover { background: var(--luxury-pink); }
        .btn-delete { background: #FADBD8; color: #CD6155; }
        
        .dash-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 0.9rem; margin-top: 12px; }
        .dash-item { border-bottom: 1px solid #FBEEE6; padding: 6px 0; font-weight: 500; }
        
        .history-card { 
            background: #FFFFFF; 
            border-radius: 20px; 
            padding: 16px; 
            margin-bottom: 12px; 
            border-left: 6px solid var(--su-primary); 
            font-size: 0.85rem; 
            box-shadow: var(--shadow);
        }
        .h-row { display: grid; grid-template-columns: 65px 1fr 45px; padding: 4px 0; border-bottom: 1px dashed #F2F4F4; }
        
        /* ดีไซน์ช่องค้นหาแนวโมเดิร์นหรู */
        .search-box { display: flex; gap: 8px; margin-bottom: 0px; }
        .search-input { 
            flex: 1; 
            padding: 12px 16px; 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            font-size: 0.9rem; 
            outline: none;
            background: #F8F9F9;
            color: var(--text-dark);
        }
        .btn-search { 
            background: var(--kw-primary); 
            color: white; 
            border: none; 
            padding: 0 20px; 
            border-radius: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(27, 79, 114, 0.2);
        }
        .search-result { 
            background: #EAFAF1; 
            padding: 14px; 
            border-radius: 16px; 
            margin-top: 12px; 
            font-size: 0.9rem; 
            display: none; 
            border: 1px solid #ABEBC6; 
            color: #196F3D;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="card">
        <div class="search-box">
            <input type="text" id="searchKey" class="search-input" placeholder="🔍 พิมพ์ชื่อทรัพย์เพื่อค้นหาวันลง...">
            <button class="btn-search" onclick="searchAssetDays()">ค้นหา</button>
        </div>
        <div id="searchResult" class="search-result"></div>
    </div>

    <div class="card" style="text-align:center;">
        <h2 style="font-size:1.2rem; color:var(--su-primary); margin: 0 0 12px 0; font-weight:700;">📂 Post Diary Studio</h2>
        <input id="date" type="date" onchange="checkTodayStatus()">
    </div>

    <div id="randomBox" class="card" style="display:block; text-align:center;">
        <button class="btn-random" onclick="startRandom()">✨ สุ่มจัดการแผนงาน (6 ทรัพย์สิน)</button>
    </div>

    <div id="inputSection" class="card" style="display: none;">
        <div class="section-title" style="color:var(--kw-primary);">🔹 แผนงานโพสต์: พี่ขวัญ</div>
        <div id="kw_rows"></div>
        
        <hr style="border:0; border-top:1px solid var(--border-color); margin:20px 0;">
        
        <div class="section-title" style="color:var(--su-primary);">🔸 แผนงานโพสต์: พี่สุ</div>
        <div id="su_rows"></div>
        
        <button class="btn-save" style="margin-top:20px" onclick="saveData()">💾 บันทึกยอดโพสต์เข้าระบบ</button>
        <button class="btn-restore" onclick="restoreBackupData()">🔄 ดึงข้อมูลสำรอง</button>
    </div>

    <div id="dashBoard" class="card" style="border-top:4px solid var(--su-primary); display:none;">
        <div style="color:var(--su-primary); font-weight:700; font-size:1rem;">📊 สรุปสถิติยอดรวมเดือนนี้</div>
        <div id="dashContent" class="dash-grid"></div>
    </div>

    <div id="historyList"></div>
</div>

<script src="https://unpkg.com/firebase@10.7.1/firebase-app-compat.js"></script>
<script src="https://unpkg.com/firebase@10.7.1/firebase-firestore-compat.js"></script>

<script>
window.onerror = function(message, source, lineno, colno, error) {
    console.log("ระบบทำงานต่อแบบเซฟโหมด");
    return true; 
};

const firebaseConfig = { apiKey: "AIzaSyCSncboyEoURJMOSx9fk8qEClmuQ_PgwDI", authDomain: "save-data-92eca.firebaseapp.com", projectId: "save-data-92eca", storageBucket: "save-data-92eca.firebasestorage.app", messagingSenderId: "661096454777", appId: "1:661096454777:web:d8b4297db798e14b76d2a8" };

let db = null;
try {
    if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    }
} catch (e) {
    console.error("Firebase setup error:", e);
}

const groups = {
    g1: ["แม่ย่าพี่ปลา 11 ไร่", "บ้านพี่แดง อรัญนคร3", "ที่ดินน้าจิต วังน้ำเย็น", "บ้านอรัญนคร 1", "ที่ดิน หลังอรัญนคร 1", "บ้านพี่หนึ่ง อรัญวิลล์"],
    g2: ["ศรีวราห์การเเดน", "แฮปปี้คอนโด", "คอนโดชีวาทัย ฮอล์มาร์ค", "คอนโด The Base Park East", "BANGKOK HORIZON รามคำแหง", "กรี เน่ คอนโดดอนเมือง", "คอนโดสุขุมวิท 49", "plum condo", "Lumpini Ville", "ลุมพินี วิลล์ รามอินทรา-ลาดปลาเค้า 1", "D condo", "Whizdom", "ยูดีไลท์3", "ARKIN Vibhavadi (ดอนเมือง)"],
    g3: ["พี่ศรีไพร (คอนสาย)", "ที่ดินบ้านนา นครนายก", "บ้านพรสิริ ขอนแก่น", "บ้านพี่ปองพระประแดง", "บ้านทาวน์โฮมพฤกษา9", "บ้านmilindaคุณมีน"]
};

const fixedAsset = "บ้านเอื้ออาทรอรัญประเทศ";
let currentDocId = null;

function generateInputRows(user, data) {
    const container = document.getElementById(`${user}_rows`);
    container.innerHTML = "";
    for (let i = 1; i <= 6; i++) {
        const rowData = (data && data[user] && data[user][`p${i}`]) ? data[user][`p${i}`] : { time: "", name: "", num: 0 };
        container.innerHTML += `
            <div class="row">
                <input type="text" class="input-time" id="${user}_t${i}" placeholder="00:00" value="${rowData.time || ''}">
                <input id="${user}_n${i}" value="${rowData.name || ''}" readonly>
                <button class="btn-action" onclick="editAssetName('${user}_n${i}')">✏️</button>
                <input id="${user}_num${i}" type="number" value="${rowData.num || 0}">
            </div>
        `;
    }
}

function editAssetName(id) {
    const input = document.getElementById(id);
    const newName = prompt("📝 แก้ไขปรับเปลี่ยนชื่อทรัพย์สิน:", input.value);
    if (newName !== null && newName.trim() !== "") {
        input.value = newName.trim();
    }
}

async function checkTodayStatus() {
    const dateVal = document.getElementById("date").value;
    if(!dateVal) return;
    
    document.getElementById("randomBox").style.display = "block";
    document.getElementById("inputSection").style.display = "none";

    if(!db) return;

    try {
        const snap = await db.collection("posts").where("date", "==", dateVal).get();
        if (!snap.empty) {
            currentDocId = snap.docs[0].id;
            document.getElementById("randomBox").style.display = "none";
            document.getElementById("inputSection").style.display = "block";
            const d = snap.docs[0].data();
            
            generateInputRows("kw", d);
            generateInputRows("su", d);
        }
        updateDashboard(); loadHistory();
    } catch (e) {
        console.error(e);
    }
}

async function startRandom() {
    const dateVal = document.getElementById("date").value;
    if(!dateVal) return;
    let finalAssets = [];
    
    const allAssetsList = [...groups.g1, ...groups.g2, ...groups.g3, fixedAsset];
    let totalPostCounts = {};
    allAssetsList.forEach(asset => { totalPostCounts[asset] = 0; });

    if (db) {
        try {
            const allSnap = await db.collection("posts").get();
            allSnap.forEach(doc => {
                const d = doc.data();
                if(d.kw && d.su) { 
                    for(let i=1; i<=6; i++) {
                        if(d.kw[`p${i}`] && d.kw[`p${i}`].name) totalPostCounts[d.kw[`p${i}`].name] = (totalPostCounts[d.kw[`p${i}`].name] || 0) + (Number(d.kw[`p${i}`].num) || 0); 
                        if(d.su[`p${i}`] && d.su[`p${i}`].name) totalPostCounts[d.su[`p${i}`].name] = (totalPostCounts[d.su[`p${i}`].name] || 0) + (Number(d.su[`p${i}`].num) || 0); 
                    }
                }
            });
        } catch(err) {}
    }

    if (dateVal === "2026-07-01") {
        const coreAsset = "ARKIN Vibhavadi (ดอนเมือง)";
        const lockFixedAsset = fixedAsset;
        
        let pool = allAssetsList
            .filter(asset => asset !== coreAsset && asset !== lockFixedAsset)
            .sort((a, b) => totalPostCounts[a] - totalPostCounts[b]);
        
        finalAssets = [coreAsset, lockFixedAsset, pool[0], pool[1], pool[2], pool[3]];
    } else {
        let pool = allAssetsList.sort((a, b) => totalPostCounts[a] - totalPostCounts[b]);
        finalAssets = pool.slice(0, 6);
    }

    let kw_assets = [...finalAssets].sort(() => 0.5 - Math.random());
    let su_assets = [...kw_assets];
    su_assets.push(su_assets.shift()); 

    if (db) {
        try {
            let uploadData = { date: dateVal, kw: {}, su: {} };
            for(let i=1; i<=6; i++) {
                uploadData.kw[`p${i}`] = { name: kw_assets[i-1], time: "", num: 0 };
                uploadData.su[`p${i}`] = { name: su_assets[i-1], time: "", num: 0 };
            }
            await db.collection("posts").add(uploadData);
            checkTodayStatus();
        } catch(e) { 
            alert("บันทึกฐานข้อมูลขัดข้อง");
        }
    }
}

async function searchAssetDays() {
    const key = document.getElementById("searchKey").value.trim();
    if(!key) return;
    if(!db) return;
    
    try {
        const snap = await db.collection("posts").orderBy("date", "desc").get();
        let matchDates = [];
        snap.forEach(doc => {
            const d = doc.data();
            let found = false;
            if(d.kw && d.su) {
                for(let i=1; i<=6; i++) {
                    if((d.kw[`p${i}`] && d.kw[`p${i}`].name.includes(key)) || (d.su[`p${i}`] && d.su[`p${i}`].name.includes(key))) {
                        found = true;
                    }
                }
            }
            if(found) matchDates.push(d.date);
        });
        
        const resBox = document.getElementById("searchResult");
        resBox.style.display = "block";
        if(matchDates.length > 0) {
            resBox.innerHTML = `<strong>📌 วันที่เคยลงโพสต์ของ "${key}":</strong><br>` + matchDates.map(d => `• ${d}`).join('<br>');
        } else {
            resBox.innerHTML = `❌ ไม่พบประวัติการลงโพสต์ของทรัพย์ชื่อ "${key}"`;
        }
    } catch(e) { console.error(e); }
}

async function saveData() { 
    if(!db) return;
    let updateData = {};
    for(let i=1; i<=6; i++) {
        updateData[`kw.p${i}.time`] = document.getElementById(`kw_t${i}`).value;
        updateData[`kw.p${i}.name`] = document.getElementById(`kw_n${i}`).value;
        updateData[`kw.pTemplate.num`] = Number(document.getElementById(`kw_num${i}`).value);
        updateData[`kw.p${i}.num`] = Number(document.getElementById(`kw_num${i}`).value);
        
        updateData[`su.p${i}.time`] = document.getElementById(`su_t${i}`).value;
        updateData[`su.p${i}.name`] = document.getElementById(`su_n${i}`).value;
        updateData[`su.p${i}.num`] = Number(document.getElementById(`su_num${i}`).value);
    }
    await db.collection("posts").doc(currentDocId).update(updateData); 
    alert("✨ บันทึกข้อมูลแผนงาน 6 ทรัพย์เรียบร้อยแล้วค่ะ!"); 
    checkTodayStatus(); 
}

async function restoreBackupData() { if(!db) return; checkTodayStatus(); }

async function updateDashboard() {
    if(!db) return;
    try {
        const dateInput = document.getElementById("date").value;
        const month = dateInput.substring(0, 7); 
        const snap = await db.collection("posts").get(); 
        let stats = {}; 
        snap.forEach(doc => { 
            const d = doc.data(); 
            if(d.date && d.date.startsWith(month) && d.kw && d.su) { 
                for(let i=1; i<=6; i++) {
                    if(d.kw[`p${i}`]) stats[d.kw[`p${i}`].name] = (stats[d.kw[`p${i}`].name] || 0) + (Number(d.kw[`p${i}`].num) || 0); 
                    if(d.su[`p${i}`]) stats[d.su[`p${i}`].name] = (stats[d.su[`p${i}`].name] || 0) + (Number(d.su[`p${i}`].num) || 0); 
                }
            } 
        });
        document.getElementById("dashContent").innerHTML = Object.entries(stats).sort((a,b) => b[1]-a[1]).map(([n, c]) => `<div class="dash-item">${n}</div><div class="dash-item" style="text-align:right"><b>${c}</b></div>`).join('') || "ไม่มีข้อมูล";
        document.getElementById("dashBoard").style.display = "block";
    } catch (e) {}
}

async function loadHistory() {
    if(!db) return;
    try {
        const snap = await db.collection("posts").orderBy("date", "desc").get(); 
        let html = ""; 
        snap.forEach(doc => { 
            const d = doc.data(); 
            if(d.date && d.kw && d.su && d.kw.p1) {
                html += `<div class="history-card"><strong>🗓 วันที่ ${d.date}</strong> <button class="btn-action" style="display:inline-block; margin-left:10px;" onclick="editEntry('${doc.id}')">✏️</button> <button class="btn-action btn-delete" style="display:inline-block;" onclick="deleteEntry('${doc.id}')">🗑️</button>`;
                
                html += `<div style="color:var(--kw-primary); margin-top:8px; font-weight:bold;">👤 พี่ขวัญ</div>`;
                for(let i=1; i<=6; i++) {
                    if(d.kw[`p${i}`]) html += `<div class="h-row" style="color:var(--kw-primary)"><span>⏰ ${d.kw[`p${i}`].time || '--:--'}</span><span>${d.kw[`p${i}`].name}</span><span>${d.kw[`p${i}`].num} โพสต์</span></div>`;
                }
                
                html += `<div style="color:var(--su-primary); margin-top:8px; font-weight:bold;">👤 พี่สุ</div>`;
                for(let i=1; i<=6; i++) {
                    if(d.su[`p${i}`]) html += `<div class="h-row" style="color:var(--su-primary)"><span>⏰ ${d.su[`p${i}`].time || '--:--'}</span><span>${d.su[`p${i}`].name}</span><span>${d.su[`p${i}`].num} โพสต์</span></div>`;
                }
                html += `</div>`;
            } 
        });
        document.getElementById("historyList").innerHTML = html;
    } catch (e) {}
}

async function editEntry(id) { if(!db)return; const doc = await db.collection("posts").doc(id).get(); document.getElementById("date").value = doc.data().date; checkTodayStatus(); }
async function deleteEntry(id) { if(!db)return; if(confirm("ยืนยันการลบประวัติรายการนี้?")) { await db.collection("posts").doc(id).delete(); checkTodayStatus(); } }

window.onload = () => { 
    const now = new Date(); document.getElementById("date").value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`; 
    checkTodayStatus();
};
</script>
</body>
</html>
